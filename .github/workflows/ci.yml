name: DBACK Fitness CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run validate

  live-mobile-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:mobile
        env:
          DBACK_LIVE_URL: https://dback-fitness.dback.workers.dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-qa-screenshots
          path: artifacts/mobile-qa
          if-no-files-found: ignore
